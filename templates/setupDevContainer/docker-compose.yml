services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspaces/project/backend:cached
      - tmp:/workspaces/project/backend/tmp
      - bundle:/workspaces/project/backend/vendor/bundle
      - /var/run/docker.sock:/var/run/docker.sock

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://postgres:postgres@db:5432/{{name}}?pool=5
      RAILS_ENV: development
      SECRET_KEY_BASE: dummy

    # Run all container processes as the non-root dev user. Without this the
    # container's default user is root (the Dockerfile ends on `USER root`),
    # so anything that isn't `postCreateCommand` (which devcontainer.json's
    # remoteUser runs as vscode) — devcontainer feature installs, the
    # `sleep infinity` command, a plain `docker compose exec` — creates
    # root-owned files. That mixed ownership can break `bundle
    # update`/`bundle install`: /usr/local/bundle/bin has the sticky bit set,
    # so vscode can't overwrite or delete binstubs it doesn't own.
    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  redis:
    image: redis:7-bookworm
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  db:
    image: postgres:15-bookworm
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./create-db-user.sql:/docker-entrypoint-initdb.d/create-db-user.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

volumes:
  postgres-data:
  tmp:
  bundle:
